<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みんなの近所マップ | riekoLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{
  --bay:#1b2a41;
  --bay-deep:#0f1c2e;
  --paper:#f6f1e7;
  --paper-dim:#efe8da;
  --coral:#e07a5f;
  --teal:#5b9aa0;
  --rose:#d96c8f;
  --amber:#e8a14b;
  --ink:#243447;
  --muted:#7a8696;
  --line:rgba(27,42,65,.10);
  --shadow:0 10px 30px rgba(15,28,46,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
  color:var(--ink);
  background:var(--paper);
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* ── header ── */
.hero{
  background:linear-gradient(135deg, var(--bay-deep) 0%, var(--bay) 55%, #5b4a5f 95%, var(--coral) 140%);
  color:#fff;
  padding:16px 18px 14px;
  box-shadow:0 6px 20px rgba(15,28,46,.24);
  z-index:500; position:relative;
}
.hero-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.back-link{font-size:.7rem; color:rgba(255,255,255,.68); text-decoration:none; font-weight:500;}
.hero h1{font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:1.15rem;}
.hero .tag{font-size:.68rem; color:rgba(255,255,255,.68); margin-top:2px;}
.live-badge{
  display:flex; align-items:center; gap:5px; font-size:.62rem; font-weight:700;
  color:rgba(255,255,255,.85); background:rgba(255,255,255,.12);
  padding:5px 10px; border-radius:100px; letter-spacing:.04em;
}
.live-dot{width:6px; height:6px; border-radius:50%; background:#7ee0a0; animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}
.header-actions{display:flex; align-items:center; gap:8px;}
.list-toggle{
  display:flex; align-items:center; gap:5px; font-size:.68rem; font-weight:700;
  color:#fff; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28);
  padding:6px 12px; border-radius:100px; cursor:pointer; font-family:inherit;
}

/* ── list panel ── */
.list-panel{
  position:fixed; inset:0; background:rgba(15,28,46,.42); z-index:800;
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.list-panel.open{opacity:1; pointer-events:auto;}
.list-sheet{
  width:100%; max-width:520px; background:var(--paper); border-radius:24px 24px 0 0;
  padding:18px 18px 20px; box-shadow:0 -10px 40px rgba(15,28,46,.3);
  transform:translateY(100%); transition:transform .25s cubic-bezier(.4,.2,.2,1);
  max-height:82vh; display:flex; flex-direction:column;
}
.list-panel.open .list-sheet{transform:translateY(0);}
.list-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.list-head h2{font-family:'Zen Maru Gothic',sans-serif; font-size:1rem;}
.list-close{background:var(--paper-dim); border:none; border-radius:100px; padding:7px 14px; font-size:.72rem; font-weight:700; color:var(--muted); cursor:pointer;}
.list-scroll{overflow-y:auto; display:flex; flex-direction:column; gap:10px;}
.area-chips{display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px; scrollbar-width:none;}
.area-chips::-webkit-scrollbar{display:none;}
.area-chip{
  flex:none; font-size:.7rem; font-weight:700; padding:6px 13px;
  border-radius:100px; border:1px solid var(--line); background:#fff;
  color:var(--muted); white-space:nowrap; cursor:pointer;
}
.area-chip.active{background:var(--bay); color:#fff; border-color:var(--bay);}

.list-filter-chips{margin-top:0; margin-bottom:10px;}
.list-filter-chips .chip{
  border:1px solid var(--line); background:#fff; color:var(--muted);
}
.list-filter-chips .chip.active{background:var(--bay); color:#fff; border-color:var(--bay);}
.list-filter-chips .chip.chip-add{display:none;}
.list-empty{text-align:center; color:var(--muted); font-size:.8rem; padding:30px 0;}
.list-item{
  background:#fff; border:1px solid var(--line); border-radius:16px; padding:13px 15px;
  cursor:pointer; box-shadow:var(--shadow); text-align:left;
}
.list-item h3{font-family:'Zen Maru Gothic',sans-serif; font-size:.92rem; margin-bottom:4px;}
.list-item .li-tags{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:5px;}
.list-item .li-tag{font-size:.58rem; font-weight:700; padding:2px 8px; border-radius:100px; color:#fff;}
.list-item .li-memo{font-size:.74rem; color:var(--ink); line-height:1.5; margin-bottom:5px;}
.list-item .li-meta{font-size:.64rem; color:var(--muted);}

/* ── filter chips ── */
.chips{display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:2px; scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:none; font-size:.7rem; font-weight:700; padding:6px 13px;
  border-radius:100px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.8); white-space:nowrap; cursor:pointer;
}
.chip.active{background:#fff; color:var(--bay); border-color:#fff;}
.chip.chip-add{border-style:dashed; background:transparent;}

/* ── map ── */
.map-wrap{flex:1; position:relative;}
#map{position:absolute; inset:0;}

/* placement banner */
.place-banner{
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  background:var(--bay-deep); color:#fff; font-size:.76rem; font-weight:700;
  padding:10px 18px; border-radius:100px; box-shadow:var(--shadow);
  z-index:600; display:flex; align-items:center; gap:8px;
  animation:drop .25s ease;
}
@keyframes drop{from{opacity:0; transform:translate(-50%,-10px);} to{opacity:1; transform:translate(-50%,0);}}
.place-banner button{
  background:rgba(255,255,255,.18); border:none; color:#fff; border-radius:100px;
  padding:4px 10px; font-size:.68rem; font-weight:700; cursor:pointer;
}

/* add button */
.fab{
  position:absolute; right:16px; bottom:20px; z-index:500;
  background:var(--coral); color:#fff; border:none; border-radius:100px;
  padding:14px 20px; font-weight:700; font-size:.86rem;
  box-shadow:0 10px 24px rgba(224,122,95,.4);
  display:flex; align-items:center; gap:7px; cursor:pointer;
}
.fab.cancel{background:var(--muted); box-shadow:0 10px 24px rgba(122,134,150,.35);}

/* ── bottom sheet form ── */
.sheet-backdrop{
  position:fixed; inset:0; background:rgba(15,28,46,.42); z-index:700;
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.sheet-backdrop.open{opacity:1; pointer-events:auto;}
.sheet{
  width:100%; max-width:520px; background:#fff; border-radius:24px 24px 0 0;
  padding:22px 20px 26px; box-shadow:0 -10px 40px rgba(15,28,46,.3);
  transform:translateY(100%); transition:transform .25s cubic-bezier(.4,.2,.2,1);
  max-height:85vh; overflow-y:auto;
}
.sheet-backdrop.open .sheet{transform:translateY(0);}
.sheet h2{font-family:'Zen Maru Gothic',sans-serif; font-size:1.05rem; margin-bottom:14px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:.7rem; font-weight:700; color:var(--muted); margin-bottom:6px; letter-spacing:.04em;}
.field input[type=text], .field textarea{
  width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 13px;
  font-family:inherit; font-size:.88rem; color:var(--ink); background:var(--paper);
}
.field textarea{resize:vertical; min-height:64px;}
.tag-picker{display:flex; gap:8px; flex-wrap:wrap;}
.tag-opt{
  padding:8px 14px; border-radius:100px; border:1px solid var(--line);
  font-size:.78rem; font-weight:700; color:var(--muted); cursor:pointer; background:#fff;
}
.tag-opt.on{color:#fff;}
.tag-opt.tag-add{border-style:dashed; color:var(--muted);}

.tag-manage-list{display:flex; flex-direction:column; gap:8px; max-height:34vh; overflow-y:auto;}
.tag-manage-row{display:flex; align-items:center; gap:7px;}
.tmr-emoji{
  flex:none; width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
  background:var(--paper); font-size:1rem; cursor:pointer;
}
.tmr-name{
  flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; padding:8px 10px;
  font-family:inherit; font-size:.84rem; color:var(--ink); background:#fff;
}
.tmr-color{flex:none; width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer;}
.tmr-del{flex:none; background:none; border:none; color:var(--rose); font-size:1rem; cursor:pointer; padding:4px;}
.sheet-actions{display:flex; gap:10px; margin-top:6px;}
.btn{
  flex:1; border:none; border-radius:14px; padding:14px; font-weight:700; font-size:.86rem;
  cursor:pointer; font-family:inherit;
}
.btn-cancel{background:var(--paper-dim); color:var(--ink);}
.btn-save{background:var(--coral); color:#fff;}
.btn-save[disabled]{opacity:.45; pointer-events:none;}

/* ── popup styling ── */
.leaflet-popup-content-wrapper{border-radius:16px; box-shadow:var(--shadow);}
.pin-pop{font-family:'Zen Kaku Gothic New',sans-serif; min-width:170px;}
.pin-pop h3{font-family:'Zen Maru Gothic',sans-serif; font-size:.94rem; margin-bottom:4px;}
.pin-pop .pop-tags{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px;}
.pin-pop .pop-tag{font-size:.6rem; font-weight:700; padding:2px 8px; border-radius:100px; color:#fff;}
.pin-pop .pop-memo{font-size:.76rem; color:var(--ink); line-height:1.5; margin-bottom:6px;}
.pin-pop .pop-meta{font-size:.65rem; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}
.pin-pop .pop-del{background:none; border:none; color:var(--rose); font-size:.68rem; font-weight:700; cursor:pointer; padding:2px;}
.pin-pop .pop-edit{background:none; border:none; color:var(--teal); font-size:.68rem; font-weight:700; cursor:pointer; padding:2px; margin-right:4px;}

.toast{
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
  background:var(--bay-deep); color:#fff; font-size:.78rem; font-weight:700;
  padding:10px 18px; border-radius:100px; z-index:900; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; box-shadow:var(--shadow);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-top">
    <div>
      <a class="back-link" href="../index.html">← riekoLab</a>
      <h1>みんなの近所マップ</h1>
      <div class="tag">high5メンバーでお気に入りを持ち寄る地図</div>
    </div>
    <div class="header-actions">
      <button class="list-toggle" id="btnList">📋 一覧</button>
      <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div class="map-wrap">
  <div id="map"></div>
  <div class="place-banner hidden" id="placeBanner" style="display:none;">
    地図をタップしてピンを置いてね
    <button id="cancelPlace">やめる</button>
  </div>
  <button class="fab" id="fabAdd">＋ 場所を追加</button>
</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h2 id="sheetTitle">新しい場所を登録</h2>
    <div class="field">
      <label>場所の名前（必須）</label>
      <input type="text" id="fName" placeholder="例：〇〇カフェ">
    </div>
    <div class="field">
      <label>タグ（必須・複数選べます）</label>
      <div class="tag-picker" id="tagPicker"></div>
    </div>
    <div class="field">
      <label>メモ（必須・おすすめポイントなど）</label>
      <textarea id="fMemo" placeholder="例：窓際の席が海を見渡せて最高"></textarea>
    </div>
    <div class="field">
      <label>リンク（任意・食べログ・公式サイトなど）</label>
      <input type="text" id="fUrl" placeholder="https://...">
    </div>
    <div class="field">
      <label>投稿者名（必須）</label>
      <input type="text" id="fPoster" placeholder="例：りえこ">
    </div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btnCancelSheet">やめる</button>
      <button class="btn btn-save" id="btnSave" disabled>この場所を登録</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="tagSheetBackdrop">
  <div class="sheet">
    <h2>タグを管理</h2>
    <div id="tagManageList" class="tag-manage-list"></div>
    <div class="field" style="margin-top:16px;">
      <label>新しいタグを作る</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="tagEmoji" placeholder="🏷️" maxlength="4" style="width:56px; text-align:center; flex:none;">
        <input type="text" id="tagName" placeholder="タグ名" style="flex:1;">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btnCancelTag">閉じる</button>
      <button class="btn btn-save" id="btnSaveTag" disabled>追加する</button>
    </div>
  </div>
</div>

<div class="list-panel" id="listPanel">
  <div class="list-sheet">
    <div class="list-head">
      <h2>登録済み一覧</h2>
      <button class="list-close" id="btnCloseList">閉じる</button>
    </div>
    <div class="chips list-filter-chips" id="listTagChips"></div>
    <div class="area-chips" id="areaChips"></div>
    <div class="list-scroll" id="listScroll"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
/* ═══════════════════════════════════════════════
   Firebase設定
   1. https://console.firebase.google.com/ で新規プロジェクトを作成
   2. 「Realtime Database」を作成（ロックモードでOK。ルールは後で設定）
   3. プロジェクト概要 → ウェブアプリを追加（</> アイコン）→ 表示された
      firebaseConfig の中身を、下の空欄にそのままコピペしてください
   ═══════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyA2kZXe0EYeGq1FtPfLmn_T8IUT7bkFrnQ",
  authDomain: "high5-map-eee4a.firebaseapp.com",
  databaseURL: "https://high5-map-eee4a-default-rtdb.firebaseio.com",
  projectId: "high5-map-eee4a",
  storageBucket: "high5-map-eee4a.firebasestorage.app",
  messagingSenderId: "497569872905",
  appId: "1:497569872905:web:1cbf05a7ce12e0e2600cd8"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, get, set, update } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const pinsRef = ref(db, "pins");
const tagsRef = ref(db, "tags");
const metaRef = ref(db, "meta/tagsSeeded");

/* ── 地図の初期化 ── */
const map = L.map('map', { zoomControl: false }).setView([35.6478, 139.7568], 15); // 港区海岸3丁目付近
L.control.zoom({ position: 'bottomleft' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

/* ── エリア自動判定（位置情報から一番近いエリア名を割り当てる） ── */
const AREAS = [
  {name:'竹芝', lat:35.6551, lng:139.7607},
  {name:'浜松町・大門', lat:35.6555, lng:139.7566},
  {name:'海岸・日の出', lat:35.6480, lng:139.7570},
  {name:'三田', lat:35.6478, lng:139.7460},
  {name:'田町', lat:35.6459, lng:139.7496},
  {name:'芝浦', lat:35.6431, lng:139.7493},
];
function getAreaName(lat, lng){
  let best = null, bestDist = Infinity;
  AREAS.forEach(a=>{
    const d = (a.lat-lat)**2 + (a.lng-lng)**2;
    if(d < bestDist){ bestDist = d; best = a.name; }
  });
  return best || 'その他';
}

/* ── タグ管理（Firebaseに保存、みんなで自由に追加できる） ── */
const DEFAULT_TAGS = [
  {name:'カフェ', emoji:'☕', color:'#5b9aa0'},
  {name:'ごはん', emoji:'🍚', color:'#e07a5f'},
  {name:'デート', emoji:'💛', color:'#d96c8f'},
  {name:'その他', emoji:'📍', color:'#e8a14b'},
  {name:'カジュアル', emoji:'🍻', color:'#8a6fb3'},
  {name:'フォーマル', emoji:'🍽️', color:'#3f5a7d'},
  {name:'役員向け', emoji:'👔', color:'#b8860b'},
  {name:'ランチ', emoji:'🍱', color:'#6b9b5e'}
];
const PALETTE = ['#5b9aa0','#e07a5f','#d96c8f','#e8a14b','#8a6fb3','#3f5a7d','#b8860b','#6b9b5e','#4d8b7c','#a8557a','#5f7d8f','#c2703d'];

let tagsData = {}; // key -> {name, emoji, color}

function getTagColor(name){
  const t = Object.values(tagsData).find(t=>t.name===name);
  return t ? t.color : '#7a8696';
}
function getTagEmoji(name){
  const t = Object.values(tagsData).find(t=>t.name===name);
  return t ? t.emoji : '🏷️';
}

// 初回のみ、デフォルトタグを書き込む
(async function seedTagsIfNeeded(){
  try{
    const metaSnap = await get(metaRef);
    if(!metaSnap.exists()){
      for(const t of DEFAULT_TAGS){
        await push(tagsRef, t);
      }
      await set(metaRef, true);
    }
  }catch(err){ console.error('タグの初期化に失敗', err); }
})();

function makeIcon(tags){
  const color = getTagColor(tags[0]) || '#1b2a41';
  return L.divIcon({
    className: '',
    html: `<div style="width:26px;height:26px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(-45deg);box-shadow:0 3px 8px rgba(15,28,46,.35);border:2px solid #fff;"></div>`,
    iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-26]
  });
}

let markers = {};      // id -> {marker, tags}
let pinsData = {};     // id -> full pin object (for list view)
let activeFilter = 'all';
let listOpen = false;

function applyFilter(){
  Object.values(markers).forEach(({marker, tags})=>{
    const show = activeFilter==='all' || tags.includes(activeFilter);
    const el = marker.getElement();
    if(el) el.style.display = show ? '' : 'none';
  });
}

function renderChips(){
  const chipsEl = document.getElementById('chips');
  const tagEntries = Object.values(tagsData);
  let html = `<div class="chip${activeFilter==='all' ? ' active' : ''}" data-tag="all">すべて</div>`;
  tagEntries.forEach(t=>{
    html += `<div class="chip${activeFilter===t.name ? ' active' : ''}" data-tag="${escapeHtml(t.name)}">${t.emoji||'🏷️'} ${escapeHtml(t.name)}</div>`;
  });
  html += `<div class="chip chip-add" data-tag="__add__">🏷️ タグ管理</div>`;
  chipsEl.innerHTML = html;
}

document.getElementById('chips').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  if(chip.classList.contains('chip-add')){ openTagSheet(); return; }
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = chip.dataset.tag;
  applyFilter();
  if(listOpen) renderList();
});

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function popupHtml(id, p){
  const tagsHtml = (p.tags||[]).map(t=>`<span class="pop-tag" style="background:${getTagColor(t)}">${escapeHtml(t)}</span>`).join('');
  const linkHtml = p.url ? `<div class="pop-memo"><a href="${escapeHtml(p.url)}" target="_blank" rel="noopener" style="color:var(--teal);">詳細を見る →</a></div>` : '';
  return `
    <div class="pin-pop">
      <h3>${escapeHtml(p.name)}</h3>
      <div class="pop-tags">${tagsHtml}</div>
      ${p.memo ? `<div class="pop-memo">${escapeHtml(p.memo)}</div>` : ''}
      ${linkHtml}
      <div class="pop-meta">
        <span>by ${escapeHtml(p.postedBy||'匿名')}</span>
        <span>
          <button class="pop-edit" data-id="${id}">編集</button>
          <button class="pop-del" data-id="${id}">削除</button>
        </span>
      </div>
    </div>`;
}

/* ── リアルタイム受信 ── */
onValue(pinsRef, (snapshot)=>{
  const data = snapshot.val() || {};
  const seenIds = new Set(Object.keys(data));
  pinsData = data;

  // 消えたピンを地図から除去
  Object.keys(markers).forEach(id=>{
    if(!seenIds.has(id)){
      map.removeLayer(markers[id].marker);
      delete markers[id];
    }
  });

  // 追加・更新
  Object.entries(data).forEach(([id, p])=>{
    if(markers[id]){
      markers[id].marker.setPopupContent(popupHtml(id, p));
      markers[id].tags = p.tags || [];
      return;
    }
    const marker = L.marker([p.lat, p.lng], { icon: makeIcon(p.tags||[]) }).addTo(map);
    marker.bindPopup(popupHtml(id, p));
    marker.on('popupopen', ()=>{
      const delBtn = document.querySelector(`.pop-del[data-id="${id}"]`);
      if(delBtn) delBtn.addEventListener('click', ()=>{
        if(confirm('この場所を削除しますか？')){
          remove(ref(db, 'pins/' + id));
        }
      });
      const editBtn = document.querySelector(`.pop-edit[data-id="${id}"]`);
      if(editBtn) editBtn.addEventListener('click', ()=>{
        map.closePopup();
        openEditSheet(id);
      });
    });
    markers[id] = { marker, tags: p.tags || [] };
  });

  applyFilter();
  if(listOpen) renderList();
}, (err)=>{
  showToast('データベースに接続できませんでした。Firebase設定を確認してね');
  console.error(err);
});

/* ── タグのリアルタイム受信 ── */
onValue(tagsRef, (snapshot)=>{
  tagsData = snapshot.val() || {};
  renderChips();
  renderTagPicker();
  renderListTagChips();
  if(tagSheetOpen) renderTagManageList();
  Object.entries(markers).forEach(([id, entry])=>{
    entry.marker.setIcon(makeIcon(entry.tags));
  });
  if(listOpen) renderList();
});

/* ── 一覧パネル ── */
const listPanel = document.getElementById('listPanel');
const listScroll = document.getElementById('listScroll');
const areaChipsEl = document.getElementById('areaChips');
const listTagChipsEl = document.getElementById('listTagChips');
let activeArea = 'all';

function renderListTagChips(){
  const tagEntries = Object.values(tagsData);
  let html = `<div class="chip${activeFilter==='all' ? ' active' : ''}" data-tag="all">すべて</div>`;
  tagEntries.forEach(t=>{
    html += `<div class="chip${activeFilter===t.name ? ' active' : ''}" data-tag="${escapeHtml(t.name)}">${t.emoji||'🏷️'} ${escapeHtml(t.name)}</div>`;
  });
  listTagChipsEl.innerHTML = html;
}

listTagChipsEl.addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  activeFilter = chip.dataset.tag;
  renderChips();
  renderListTagChips();
  applyFilter();
  renderList();
});

function renderAreaChips(){
  let html = `<div class="area-chip active" data-area="all">すべてのエリア</div>`;
  AREAS.forEach(a=>{
    html += `<div class="area-chip" data-area="${escapeHtml(a.name)}">${escapeHtml(a.name)}</div>`;
  });
  areaChipsEl.innerHTML = html;
}
renderAreaChips();

areaChipsEl.addEventListener('click', (e)=>{
  const chip = e.target.closest('.area-chip');
  if(!chip) return;
  areaChipsEl.querySelectorAll('.area-chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  activeArea = chip.dataset.area;
  renderList();
});

function renderList(){
  const entries = Object.entries(pinsData)
    .filter(([id, p]) => activeFilter==='all' || (p.tags||[]).includes(activeFilter))
    .filter(([id, p]) => activeArea==='all' || getAreaName(p.lat, p.lng)===activeArea)
    .sort((a,b) => (b[1].createdAt||0) - (a[1].createdAt||0));

  if(entries.length === 0){
    listScroll.innerHTML = `<div class="list-empty">この条件だとまだ場所がないよ</div>`;
    return;
  }

  listScroll.innerHTML = entries.map(([id, p])=>{
    const tagsHtml = (p.tags||[]).map(t=>`<span class="li-tag" style="background:${getTagColor(t)}">${escapeHtml(t)}</span>`).join('');
    const dateStr = p.createdAt ? new Date(p.createdAt).toLocaleDateString('ja-JP', {month:'numeric', day:'numeric'}) : '';
    const areaName = getAreaName(p.lat, p.lng);
    return `
      <button class="list-item" data-id="${id}">
        <h3>${escapeHtml(p.name)}</h3>
        <div class="li-tags">${tagsHtml}</div>
        ${p.memo ? `<div class="li-memo">${escapeHtml(p.memo)}</div>` : ''}
        <div class="li-meta">📍${escapeHtml(areaName)} ・ by ${escapeHtml(p.postedBy||'匿名')} ・ ${dateStr}</div>
      </button>`;
  }).join('');
}

listScroll.addEventListener('click', (e)=>{
  const item = e.target.closest('.list-item');
  if(!item) return;
  const id = item.dataset.id;
  const p = pinsData[id];
  if(!p) return;
  closeList();
  map.setView([p.lat, p.lng], 17);
  const entry = markers[id];
  if(entry) entry.marker.openPopup();
});

function openList(){
  listOpen = true;
  renderListTagChips();
  renderList();
  listPanel.classList.add('open');
}
function closeList(){
  listOpen = false;
  listPanel.classList.remove('open');
}

document.getElementById('btnList').addEventListener('click', openList);
document.getElementById('btnCloseList').addEventListener('click', closeList);
listPanel.addEventListener('click', (e)=>{ if(e.target===listPanel) closeList(); });

/* ── ピン設置フロー ── */
let placing = false;
let pendingLatLng = null;
let selectedTags = [];
let editingId = null;

const fab = document.getElementById('fabAdd');
const placeBanner = document.getElementById('placeBanner');
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheetTitle = document.getElementById('sheetTitle');
const fName = document.getElementById('fName');
const fMemo = document.getElementById('fMemo');
const fUrl = document.getElementById('fUrl');
const fPoster = document.getElementById('fPoster');
const btnSave = document.getElementById('btnSave');

fab.addEventListener('click', ()=>{
  placing = true;
  placeBanner.style.display = 'flex';
  fab.style.display = 'none';
  map.getContainer().style.cursor = 'crosshair';
});

document.getElementById('cancelPlace').addEventListener('click', stopPlacing);

function stopPlacing(){
  placing = false;
  placeBanner.style.display = 'none';
  fab.style.display = 'flex';
  map.getContainer().style.cursor = '';
}

map.on('click', (e)=>{
  if(!placing) return;
  pendingLatLng = e.latlng;
  stopPlacing();
  openSheet();
});

function openSheet(){
  editingId = null;
  sheetTitle.textContent = '新しい場所を登録';
  btnSave.textContent = 'この場所を登録';
  fName.value = ''; fMemo.value = ''; fUrl.value = ''; fPoster.value = '';
  selectedTags = [];
  renderTagPicker();
  validateForm();
  sheetBackdrop.classList.add('open');
}

function openEditSheet(id){
  const p = pinsData[id];
  if(!p) return;
  editingId = id;
  sheetTitle.textContent = '場所を編集';
  btnSave.textContent = '変更を保存';
  fName.value = p.name || '';
  fMemo.value = p.memo || '';
  fUrl.value = p.url || '';
  fPoster.value = p.postedBy || '';
  selectedTags = [...(p.tags || [])];
  renderTagPicker();
  validateForm();
  sheetBackdrop.classList.add('open');
}

function closeSheet(){ sheetBackdrop.classList.remove('open'); editingId = null; }

document.getElementById('btnCancelSheet').addEventListener('click', closeSheet);
sheetBackdrop.addEventListener('click', (e)=>{ if(e.target===sheetBackdrop) closeSheet(); });

function renderTagPicker(){
  const picker = document.getElementById('tagPicker');
  const tagEntries = Object.values(tagsData);
  let html = tagEntries.map(t=>{
    const on = selectedTags.includes(t.name);
    const style = on ? `background:${t.color}; color:#fff; border-color:${t.color};` : '';
    return `<div class="tag-opt${on?' on':''}" data-tag="${escapeHtml(t.name)}" data-color="${t.color}" style="${style}">${t.emoji||'🏷️'} ${escapeHtml(t.name)}</div>`;
  }).join('');
  html += `<div class="tag-opt tag-add" data-tag="__add__">🏷️ タグ管理</div>`;
  picker.innerHTML = html;
}

document.getElementById('tagPicker').addEventListener('click', (e)=>{
  const opt = e.target.closest('.tag-opt');
  if(!opt) return;
  if(opt.classList.contains('tag-add')){ openTagSheet(); return; }
  const t = opt.dataset.tag, color = opt.dataset.color;
  const on = opt.classList.toggle('on');
  if(on){ selectedTags.push(t); opt.style.background = color; opt.style.color = '#fff'; opt.style.borderColor = color; }
  else{ selectedTags = selectedTags.filter(x=>x!==t); opt.style.background = '#fff'; opt.style.color = 'var(--muted)'; opt.style.borderColor='var(--line)'; }
  validateForm();
});

/* ── 新しいタグを作る／既存タグの管理 ── */
const tagSheetBackdrop = document.getElementById('tagSheetBackdrop');
const tagEmojiInput = document.getElementById('tagEmoji');
const tagNameInput = document.getElementById('tagName');
const btnSaveTag = document.getElementById('btnSaveTag');
let tagSheetOpen = false;

function openTagSheet(){
  tagEmojiInput.value = '';
  tagNameInput.value = '';
  btnSaveTag.disabled = true;
  tagSheetOpen = true;
  renderTagManageList();
  tagSheetBackdrop.classList.add('open');
}
function closeTagSheet(){
  tagSheetOpen = false;
  tagSheetBackdrop.classList.remove('open');
}

tagNameInput.addEventListener('input', ()=>{ btnSaveTag.disabled = !tagNameInput.value.trim(); });
document.getElementById('btnCancelTag').addEventListener('click', closeTagSheet);
tagSheetBackdrop.addEventListener('click', (e)=>{ if(e.target===tagSheetBackdrop) closeTagSheet(); });

function renderTagManageList(){
  const list = document.getElementById('tagManageList');
  list.innerHTML = Object.entries(tagsData).map(([key, t])=>`
    <div class="tag-manage-row" data-key="${key}">
      <button type="button" class="tmr-emoji" data-key="${key}" title="絵文字を変える">${t.emoji||'🏷️'}</button>
      <input type="text" class="tmr-name" data-key="${key}" value="${escapeHtml(t.name)}">
      <button type="button" class="tmr-color" data-key="${key}" style="background:${t.color}" title="色を変える"></button>
      <button type="button" class="tmr-del" data-key="${key}" title="削除">🗑</button>
    </div>`).join('');
}

// 絵文字変更
document.getElementById('tagManageList').addEventListener('click', async (e)=>{
  const emojiBtn = e.target.closest('.tmr-emoji');
  const colorBtn = e.target.closest('.tmr-color');
  const delBtn = e.target.closest('.tmr-del');

  if(emojiBtn){
    const key = emojiBtn.dataset.key;
    const current = tagsData[key]?.emoji || '🏷️';
    const next = prompt('絵文字を入力してね', current);
    if(next && next.trim()){
      try{ await update(ref(db, 'tags/' + key), { emoji: next.trim() }); }
      catch(err){ showToast('更新に失敗したよ…'); console.error(err); }
    }
    return;
  }

  if(colorBtn){
    const key = colorBtn.dataset.key;
    const current = tagsData[key]?.color;
    const idx = PALETTE.indexOf(current);
    const nextColor = PALETTE[(idx + 1 + PALETTE.length) % PALETTE.length];
    try{ await update(ref(db, 'tags/' + key), { color: nextColor }); }
    catch(err){ showToast('更新に失敗したよ…'); console.error(err); }
    return;
  }

  if(delBtn){
    const key = delBtn.dataset.key;
    const name = tagsData[key]?.name || '';
    if(confirm(`「${name}」タグを削除する？\n(このタグが付いている場所は残りますが、タグ表示がグレーになります)`)){
      try{ await remove(ref(db, 'tags/' + key)); }
      catch(err){ showToast('削除に失敗したよ…'); console.error(err); }
    }
    return;
  }
});

// タグ名の変更（変更確定時に、そのタグを使っているピンも一括更新）
document.getElementById('tagManageList').addEventListener('change', async (e)=>{
  const input = e.target.closest('.tmr-name');
  if(!input) return;
  const key = input.dataset.key;
  const oldName = tagsData[key]?.name;
  const newName = input.value.trim();

  if(!newName){ input.value = oldName; return; }
  if(newName === oldName) return;
  if(Object.values(tagsData).some(t=>t.name===newName)){
    showToast('その名前のタグはもうあるよ');
    input.value = oldName;
    return;
  }

  try{
    await update(ref(db, 'tags/' + key), { name: newName });
    // このタグを使っている既存のピンも一括で名前を差し替える
    const affected = Object.entries(pinsData).filter(([id, p]) => (p.tags||[]).includes(oldName));
    for(const [id, p] of affected){
      const newTags = p.tags.map(t => t===oldName ? newName : t);
      await set(ref(db, 'pins/' + id + '/tags'), newTags);
    }
    showToast('タグ名を変更したよ！');
  }catch(err){
    showToast('変更に失敗したよ…');
    console.error(err);
  }
});

btnSaveTag.addEventListener('click', async ()=>{
  const name = tagNameInput.value.trim();
  if(!name) return;
  if(Object.values(tagsData).some(t=>t.name===name)){
    showToast('そのタグはもうあるよ');
    return;
  }
  const emoji = tagEmojiInput.value.trim() || '🏷️';
  const color = PALETTE[Object.keys(tagsData).length % PALETTE.length];
  try{
    await push(tagsRef, { name, emoji, color });
    tagEmojiInput.value = ''; tagNameInput.value = ''; btnSaveTag.disabled = true;
    showToast('タグを作ったよ！');
  }catch(err){
    showToast('タグの作成に失敗したよ…');
    console.error(err);
  }
});

fName.addEventListener('input', validateForm);
fMemo.addEventListener('input', validateForm);
fPoster.addEventListener('input', validateForm);
function validateForm(){
  btnSave.disabled = !(
    fName.value.trim() &&
    selectedTags.length>0 &&
    fMemo.value.trim() &&
    fPoster.value.trim()
  );
}

btnSave.addEventListener('click', async ()=>{
  if(editingId){
    const existing = pinsData[editingId];
    if(!existing) return;
    const payload = {
      name: fName.value.trim(),
      tags: selectedTags,
      memo: fMemo.value.trim(),
      url: fUrl.value.trim(),
      postedBy: fPoster.value.trim() || '匿名'
    };
    try{
      await update(ref(db, 'pins/' + editingId), payload);
      closeSheet();
      showToast('変更を保存したよ！');
    }catch(err){
      showToast('保存に失敗したよ…');
      console.error(err);
    }
    return;
  }

  if(!pendingLatLng) return;
  const payload = {
    name: fName.value.trim(),
    tags: selectedTags,
    memo: fMemo.value.trim(),
    url: fUrl.value.trim(),
    postedBy: fPoster.value.trim() || '匿名',
    lat: pendingLatLng.lat,
    lng: pendingLatLng.lng,
    createdAt: Date.now()
  };
  try{
    await push(pinsRef, payload);
    closeSheet();
    showToast('登録したよ！');
  }catch(err){
    showToast('保存に失敗したよ…');
    console.error(err);
  }
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
</script>
